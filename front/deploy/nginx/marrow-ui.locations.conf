# Marrow static frontend — nginx location include.
#
# Include inside the existing marrow.example.com server{} block (the same one
# that proxies /api/* to the gateway; see ../../../backend/deploy/nginx/marrow.example.conf).
# Must be placed before the `location ^~ /api/ { return 404; }` catch-all so
# /api/* keeps resolving to the gateway's proxied locations, not this SPA route.
#
# CI deploys built static files to this path (see ../../.gitlab-ci.yml,
# FRONT_DEPLOY_PATH). Deploy is a plain file copy; no nginx reload is needed
# for content updates, only for config changes.

root /var/www/marrow-ui;
index index.html;

location / {
  try_files $uri $uri/ /index.html;
}
