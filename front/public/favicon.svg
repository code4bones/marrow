<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Marrow">
  <title>Marrow</title>
  <style>
    /* Standalone favicons get no page CSS context, so currentColor always
       resolved to black -- invisible on a dark browser tab bar.
       prefers-color-scheme support for favicon SVGs is too inconsistent
       across browsers to rely on (confirmed: stayed on the dark branch's
       default in practice) -- fixed light fill instead, since the app
       itself has no light theme at all (ThemeProvider forces darkAlgorithm
       unconditionally), so a light-on-dark badge is the right default. */
    .badge { fill: #F5F5F5; }
  </style>
  <mask id="m">
    <rect width="256" height="256" fill="black"/>
    <circle cx="128" cy="128" r="124" fill="white"/>
    <g stroke="black" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M88 66 L88 168" stroke-width="24"/>
      <path d="M168 66 L168 168" stroke-width="24"/>
      <path d="M88 66 L128 154" stroke-width="24"/>
      <path d="M168 66 L128 154" stroke-width="24"/>
    </g>
    <circle cx="88" cy="48" r="21" fill="black"/>
    <circle cx="168" cy="48" r="21" fill="black"/>
  </mask>
  <rect width="256" height="256" class="badge" mask="url(#m)"/>
</svg>
