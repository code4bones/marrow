stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE_TAG: "pmemui-build:$CI_PIPELINE_ID"
  DEPLOY_PATH: "/var/www/pmemui"

# Runs on every branch push and merge request pipeline. Lint, typecheck, and
# vite build all happen inside the Docker build stage (see Dockerfile) so a
# failure in any of them fails this job. The runner needs `docker` on PATH.
build:
  stage: build
  tags:
    - pmem_front
  script:
    - docker build --target build -t "$DOCKER_IMAGE_TAG" .
    - CID=$(docker create "$DOCKER_IMAGE_TAG")
    - rm -rf dist
    - docker cp "$CID:/app/dist" ./dist
    - docker rm "$CID"
    - docker rmi "$DOCKER_IMAGE_TAG"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Static-only deploy: the runner already lives on the deploy target
# (192.168.1.68), so this is a local file copy, not an SSH/rsync-over-network
# step. Triggered only on tag pushes (release = tag), not on every main push.
deploy:
  stage: deploy
  tags:
    - pmem_front
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - test -d dist && [ "$(ls -A dist)" ]
    - mkdir -p "$DEPLOY_PATH"
    - rsync -a --delete dist/ "$DEPLOY_PATH/"
  environment:
    name: production
    url: https://pmem.undoo.ru
