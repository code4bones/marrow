stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE_TAG: "pmemui-build:$CI_PIPELINE_ID"
  DEPLOY_PATH: "/var/www/pmemui"

# Tag pushes and merge request pipelines only — NOT every plain push to
# main, to avoid a second redundant pipeline racing the tag-triggered
# release pipeline (main is always pushed right before its release tag, so
# an unrestricted build job here fired twice per release for no benefit,
# see I-MEMORY-031). Ordinary commits to main get no CI feedback until
# their release tag; open an MR first if you want pre-tag verification.
# Lint, typecheck, and vite build all happen inside the Docker build stage
# (see Dockerfile) so a failure in any of them fails this job. The runner
# needs `docker` on PATH.
build:
  stage: build
  tags:
    - pmem_front
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_MERGE_REQUEST_ID'
  script:
    - docker build --target build -t "$DOCKER_IMAGE_TAG" .
    - CID=$(docker create "$DOCKER_IMAGE_TAG")
    - rm -rf dist
    - docker cp "$CID:/app/dist" ./dist
    - docker rm "$CID"
    - docker rmi "$DOCKER_IMAGE_TAG"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Static-only deploy: the runner already lives on the deploy target
# (192.168.1.68), so this is a local file copy, not an SSH/rsync-over-network
# step. Triggered only on tag pushes (release = tag), not on every main push.
deploy:
  stage: deploy
  tags:
    - pmem_front
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - test -d dist && [ "$(ls -A dist)" ]
    - mkdir -p "$DEPLOY_PATH"
    # --omit-dir-times: DEPLOY_PATH's directory entries (., assets/) predate
    # the pmem_front runner user and it isn't their owner, so -a's default
    # attempt to set directory mtimes hits EPERM (non-owners can chgrp/write
    # contents but not utime() a directory they don't own) and rsync exits 23
    # even though every file transferred correctly. File mtimes are still
    # preserved as normal; only directory mtimes are skipped.
    - rsync -a --omit-dir-times --delete dist/ "$DEPLOY_PATH/"
  environment:
    name: production
    url: https://pmem.undoo.ru
