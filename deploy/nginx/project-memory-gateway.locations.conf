# Include this file inside an nginx server {} block.
#
# The Project Memory gateway should listen on localhost, for example:
# BIND=127.0.0.1
# PORT=8765
#
# Public routes exposed by this include:
#   POST /project-memory/mcp    -> /mcp
#   GET  /project-memory/health -> /health
#   GET  /project-memory/ready  -> /ready
#   GET  /project-memory/tools  -> /tools
#   POST /project-memory/call   -> /call
#   GET  /project-memory/artifacts/<id>/download -> /artifacts/<id>/download
#   GET  /project-memory/.well-known/oauth-protected-resource -> /.well-known/oauth-protected-resource
#   GET  /project-memory/.well-known/oauth-authorization-server -> /.well-known/oauth-authorization-server
#   GET  /project-memory/.well-known/jwks.json -> /.well-known/jwks.json
#   GET  /project-memory/oauth/authorize -> /oauth/authorize
#   POST /project-memory/oauth/authorize -> /oauth/authorize
#   POST /project-memory/oauth/token -> /oauth/token

location = /project-memory/.well-known/oauth-protected-resource {
  proxy_pass http://127.0.0.1:8765/.well-known/oauth-protected-resource;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
}

location = /project-memory/.well-known/oauth-authorization-server {
  proxy_pass http://127.0.0.1:8765/.well-known/oauth-authorization-server;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
}

location = /project-memory/.well-known/jwks.json {
  proxy_pass http://127.0.0.1:8765/.well-known/jwks.json;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
}

location = /project-memory/oauth/authorize {
  client_max_body_size 64k;
  proxy_pass http://127.0.0.1:8765/oauth/authorize;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
}

location = /project-memory/oauth/token {
  limit_except POST {
    deny all;
  }

  client_max_body_size 64k;
  proxy_pass http://127.0.0.1:8765/oauth/token;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
}

location = /project-memory/mcp {
  client_max_body_size 2m;
  proxy_buffering off;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
  proxy_pass http://127.0.0.1:8765/mcp;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header X-Project-Memory-Client-ID $http_x_project_memory_client_id;
  proxy_set_header X-Project-Memory-Client-Label $http_x_project_memory_client_label;
  proxy_set_header X-Project-Memory-Client-Kind $http_x_project_memory_client_kind;
}

location = /project-memory/health {
  proxy_pass http://127.0.0.1:8765/health;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header Authorization $http_authorization;
}

location = /project-memory/ready {
  proxy_pass http://127.0.0.1:8765/ready;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header Authorization $http_authorization;
}

location = /project-memory/tools {
  proxy_pass http://127.0.0.1:8765/tools;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header Authorization $http_authorization;
}

location = /project-memory/call {
  limit_except POST {
    deny all;
  }

  client_max_body_size 2m;
  proxy_buffering off;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
  proxy_pass http://127.0.0.1:8765/call;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header Authorization $http_authorization;
}

location ^~ /project-memory/artifacts/ {
  proxy_pass http://127.0.0.1:8765/artifacts/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header Authorization $http_authorization;
}

location ^~ /project-memory/ {
  return 404;
}
