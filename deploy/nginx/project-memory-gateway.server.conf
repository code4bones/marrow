# Internal nginx server for Project Memory Gateway.
#
# Put this file into an internal nginx conf.d/ directory, or copy the server {}
# block into the internal nginx configuration managed behind Nginx Proxy Manager.
#
# Nginx Proxy Manager should proxy to:
#   http://<internal-nginx-host>:8088
#
# The Node gateway should listen on:
#   PROJECT_MEMORY_GATEWAY_HOST=127.0.0.1
#   PROJECT_MEMORY_GATEWAY_PORT=8765

server {
  listen 127.0.0.1:8088;
  server_name project-memory-gateway.internal;

  access_log /var/log/nginx/project-memory-gateway.access.log;
  error_log /var/log/nginx/project-memory-gateway.error.log warn;

  include /absolute/path/to/project-memory-mcp/deploy/nginx/project-memory-gateway.locations.conf;
}
