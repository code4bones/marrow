# PMemUI static frontend — nginx location include.
#
# Include inside the existing pmem.undoo.ru server{} block (the same one that
# proxies /api/* to the gateway; see project-memory-mcp/deploy/nginx/pmem.undoo.conf).
# Must be placed before the `location ^~ /api/ { return 404; }` catch-all so
# /api/* keeps resolving to the gateway's proxied locations, not this SPA route.
#
# CI deploys built static files to this path (see ../../.gitlab-ci.yml,
# DEPLOY_PATH). Deploy is a plain file copy; no nginx reload is needed for
# content updates, only for config changes.

root /var/www/pmemui;
index index.html;

location / {
  try_files $uri $uri/ /index.html;
}
