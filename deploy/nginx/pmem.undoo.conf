
upstream pmem_back {
    server 192.168.1.107:7000;
} 

server {
	  listen 127.0.0.1:8081;
	  server_name pmem.undoo.ru;

	  access_log /var/log/nginx/pmem.access.log;
	  error_log /var/log/nginx/pmem.error.log;

	# Public routes exposed by this include:
	#   POST /project-memory/mcp    -> /mcp
	#   GET  /project-memory/health -> /health
	#   GET  /project-memory/ready  -> /ready
	#   GET  /project-memory/tools  -> /tools
	#   POST /project-memory/call   -> /call
	#   GET  /api/artifacts/<id>/download -> /artifacts/<id>/download


	location = /api/mcp {
	  client_max_body_size 2m;
	  proxy_buffering off;
	  proxy_read_timeout 120s;
	  proxy_send_timeout 120s;
	  proxy_pass http://pmem_back/mcp;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	  proxy_set_header Authorization $http_authorization;
	  proxy_set_header X-Project-Memory-Client-ID $http_x_project_memory_client_id;
	  proxy_set_header X-Project-Memory-Client-Label $http_x_project_memory_client_label;
	  proxy_set_header X-Project-Memory-Client-Kind $http_x_project_memory_client_kind;
	}

	location = /api/health {
	  proxy_pass http://pmem_back/health;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	  proxy_set_header Authorization $http_authorization;
	}

	location = /api/ready {
	  proxy_pass http://pmem_back/ready;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	  proxy_set_header Authorization $http_authorization;
	}

	location = /api/tools {
	  proxy_pass http://pmem_back/tools;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	  proxy_set_header Authorization $http_authorization;
	}

	location = /api/call {
	  limit_except POST {
	    deny all;
	  }

	  client_max_body_size 2m;
	  proxy_buffering off;
	  proxy_read_timeout 120s;
	  proxy_send_timeout 120s;
	  proxy_pass http://pmem_back/call;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	  proxy_set_header Authorization $http_authorization;
	}

	location ^~ /api/artifacts/ {
	  proxy_pass http://pmem_back/artifacts/;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	  proxy_set_header Authorization $http_authorization;
	}

	location ^~ /api/ {
	  return 404;
	}



}
