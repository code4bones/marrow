
upstream pmem_back {
    server 192.168.1.68:7000;
} 

server {
	  listen 8081;
	  server_name pmem.undoo.ru;

	  access_log /var/log/nginx/pmem.access.log;
	  error_log /var/log/nginx/pmem.error.log;

	# PMemUI static frontend (SPA), deployed by the front repo's GitLab CI
	# to /var/www/pmemui on tag push. See front/deploy/nginx/pmemui.locations.conf
	# in the pmemui repo for the source of this block.
	root /var/www/pmemui;
	index index.html;

	location / {
	  try_files $uri $uri/ /index.html;
	}

	# Public routes exposed by this include:
	#   POST /api/mcp    -> /mcp
	#   GET  /api/health -> /health
	#   GET  /api/ready  -> /ready
	#   GET  /api/tools  -> /tools
	#   POST /api/call   -> /call
	#   GET/POST/OPTIONS /api/graphql -> /api/graphql
	#   GET  /api/artifacts/<id>/download -> /artifacts/<id>/download
	#   GET  /api/.well-known/oauth-protected-resource -> /.well-known/oauth-protected-resource
	#   GET  /api/.well-known/oauth-protected-resource/mcp -> /.well-known/oauth-protected-resource/mcp
	#   GET  /api/.well-known/oauth-authorization-server -> /.well-known/oauth-authorization-server
	#   GET  /.well-known/oauth-authorization-server/api -> /.well-known/oauth-authorization-server/api
	#   GET  /.well-known/openid-configuration/api -> /.well-known/openid-configuration/api
	#   GET  /.well-known/oauth-protected-resource/api/mcp -> /.well-known/oauth-protected-resource/api/mcp
	#   GET  /api/.well-known/jwks.json -> /.well-known/jwks.json
	#   GET  /api/oauth/authorize -> /oauth/authorize
	#   POST /api/oauth/authorize -> /oauth/authorize
	#   POST /api/oauth/token -> /oauth/token


	location = /api/.well-known/oauth-protected-resource {
	  proxy_pass http://pmem_back/.well-known/oauth-protected-resource;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	}

	location ^~ /api/.well-known/oauth-protected-resource/ {
	  proxy_pass http://pmem_back/.well-known/oauth-protected-resource/;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	}

	location = /api/.well-known/oauth-authorization-server {
	  proxy_pass http://pmem_back/.well-known/oauth-authorization-server;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	}

	location ~ ^/\.well-known/(oauth-authorization-server|openid-configuration|oauth-protected-resource)/api(/.*)?$ {
	  proxy_pass http://pmem_back;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	}

	location = /api/.well-known/jwks.json {
	  proxy_pass http://pmem_back/.well-known/jwks.json;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	}

	location = /api/oauth/authorize {
	  client_max_body_size 64k;
	  proxy_pass http://pmem_back/oauth/authorize;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	}

	location = /api/oauth/token {
	  limit_except POST {
	    deny all;
	  }

	  client_max_body_size 64k;
	  proxy_pass http://pmem_back/oauth/token;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	}

	location = /api/mcp {
	  client_max_body_size 2m;
	  proxy_buffering off;
	  proxy_read_timeout 120s;
	  proxy_send_timeout 120s;
	  proxy_pass http://pmem_back/mcp;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	  proxy_set_header Authorization $http_authorization;
	  proxy_set_header X-Project-Memory-Client-ID $http_x_project_memory_client_id;
	  proxy_set_header X-Project-Memory-Client-Label $http_x_project_memory_client_label;
	  proxy_set_header X-Project-Memory-Client-Kind $http_x_project_memory_client_kind;
	}

	location = /api/health {
	  proxy_pass http://pmem_back/health;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	  proxy_set_header Authorization $http_authorization;
	}

	location = /api/ready {
	  proxy_pass http://pmem_back/ready;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	  proxy_set_header Authorization $http_authorization;
	}

	location = /api/tools {
	  proxy_pass http://pmem_back/tools;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	  proxy_set_header Authorization $http_authorization;
	}

	location = /api/call {
	  limit_except POST {
	    deny all;
	  }

	  client_max_body_size 2m;
	  proxy_buffering off;
	  proxy_read_timeout 120s;
	  proxy_send_timeout 120s;
	  proxy_pass http://pmem_back/call;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	  proxy_set_header Authorization $http_authorization;
	}

	location = /api/graphql {
	  client_max_body_size 4m;
	  proxy_buffering off;
	  proxy_read_timeout 300s;
	  proxy_send_timeout 300s;
	  proxy_pass http://pmem_back/api/graphql;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_set_header X-Request-ID $request_id;
	  proxy_set_header Authorization $http_authorization;
	  proxy_set_header X-Project-Memory-Client-ID $http_x_project_memory_client_id;
	  proxy_set_header X-Project-Memory-Client-Label $http_x_project_memory_client_label;
	  proxy_set_header X-Project-Memory-Client-Kind $http_x_project_memory_client_kind;
	}

	location ^~ /api/artifacts/ {
		proxy_pass http://pmem_back/artifacts/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Request-ID $request_id;
		proxy_set_header Authorization $http_authorization;
	}


	location ^~ /api/ {
	  return 404;
	}



}
